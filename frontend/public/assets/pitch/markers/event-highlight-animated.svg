<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="none" viewBox="0 0 80 80"><title>Highlighted event (animated)</title><style>.r{transform-origin:40px 40px;animation:p 1.8s cubic-bezier(.2,0,0,1) infinite}.r2{animation-delay:.6s}@keyframes p{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1);opacity:0}}@media (prefers-reduced-motion:reduce){.r{animation:none;opacity:.4}}</style><circle cx="40" cy="40" r="36" stroke="#BCFF47" stroke-width="2" class="r"/><circle cx="40" cy="40" r="36" stroke="#BCFF47" stroke-width="2" class="r r2"/><circle cx="40" cy="40" r="9" fill="#BCFF47"/><circle cx="40" cy="40" r="3.5" fill="#07111F"/></svg>