name: container

# Builds the PULSE AI image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/pulseai:latest  and  ghcr.io/<owner>/pulseai:<commit sha>
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r backend/requirements-runtime.txt pytest
      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pulseai:latest
            ghcr.io/${{ github.repository_owner }}/pulseai:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=PULSE AI - Beyond the Scoreline
          cache-from: type=gha
          cache-to: type=gha,mode=max
